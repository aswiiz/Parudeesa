<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Parudeesa</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body class="login-body">

  <!-- Page loader -->
  <div class="page-loader" id="page-loader">
    <span class="page-loader-logo">Parudeesa</span>
    <div class="page-loader-dots">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>
  </div>

  <div class="login-wrap" id="login-wrap" style="display:none;">
    <div class="login-card">
      <div class="login-logo">
        <span class="login-logo-text">Parudeesa</span>
        <span class="login-logo-sub">Play · Dine · Event Hub</span>
        <span class="login-badge">🔐 Administration Portal</span>
      </div>

      <h2 class="login-title">Welcome Back, Admin</h2>
      <p class="login-subtitle">Sign in to access the management dashboard</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="admin-email">Email Address</label>
          <input class="form-input" type="email" id="admin-email" placeholder="enter your email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="admin-password">Password</label>
          <input class="form-input" type="password" id="admin-password" placeholder="enter your password" autocomplete="current-password" required>
        </div>

        <div class="login-error" id="login-error">
          🚫 Access Denied. Administrator privileges required.
        </div>
        <div class="login-loader" id="login-loader">
          <span class="spinner"></span> Authenticating…
        </div>

        <button type="submit" class="btn-login" id="btn-login">Sign In to Dashboard</button>
      </form>

      <p style="text-align:center;margin-top:20px;font-size:.78rem;color:var(--text-muted);">
        <a href="/" style="color:var(--gold);text-decoration:none;">← Return to Parudeesa Website</a>
      </p>
    </div>
  </div>

  <div class="admin-toast" id="admin-toast"><span class="toast-icon" id="toast-icon"></span><span id="toast-msg"></span></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    // ⚙️ CONFIGURE: Replace with your Firebase credentials
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_EMAIL = 'parudeesa@admin.com';
    const loader = document.getElementById('page-loader');
    const wrap = document.getElementById('login-wrap');
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('admin-email');
    const passInput = document.getElementById('admin-password');
    const errBox = document.getElementById('login-error');
    const loginLoader = document.getElementById('login-loader');
    const btnLogin = document.getElementById('btn-login');

    function showToast(msg, type='info') {
      const t = document.getElementById('admin-toast');
      const icon = document.getElementById('toast-icon');
      const msgEl = document.getElementById('toast-msg');
      t.className = 'admin-toast toast-' + type;
      icon.textContent = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
      msgEl.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    async function isAdminUser(user) {
      if (user.email !== ADMIN_EMAIL) return false;
      try {
        const q = query(collection(db, 'admins'), where('email', '==', user.email), where('role', '==', 'admin'));
        const snap = await getDocs(q);
        return !snap.empty;
      } catch { return false; }
    }

    // Check existing session
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const admin = await isAdminUser(user);
        if (admin) {
          window.location.href = './dashboard.html';
          return;
        } else {
          await signOut(auth);
        }
      }
      loader.style.display = 'none';
      wrap.style.display = 'block';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      loginLoader.classList.add('show');
      btnLogin.disabled = true;

      const email = emailInput.value.trim();
      const password = passInput.value;

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const admin = await isAdminUser(cred.user);

        if (!admin) {
          await signOut(auth);
          loginLoader.classList.remove('show');
          errBox.classList.add('show');
          btnLogin.disabled = false;
          return;
        }

        showToast('Login successful! Redirecting…', 'success');
        setTimeout(() => { window.location.href = './dashboard.html'; }, 800);

      } catch (err) {
        loginLoader.classList.remove('show');
        errBox.classList.add('show');
        btnLogin.disabled = false;
        console.error('Auth error:', err.code);
      }
    });
  </script>
</body>
</html>
